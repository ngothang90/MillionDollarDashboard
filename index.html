<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Million Dollar Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b1220;
    color:#fff;
    font-family:Arial,sans-serif;
}

.c{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:#66eeff;
    margin:5px 0 20px;
    font-size:28px;
}


/* ==============================
   COUNTDOWN
============================== */

.cards{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
}

.card{
    background:#16233b;
    padding:15px 10px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
}

.n{
    font-size:48px;
    color:#66ff99;
    font-weight:bold;
}

.card-label{
    margin-top:5px;
    color:#cbd5e1;
    font-size:18px;
}


/* ==============================
   INPUT
============================== */

.input-area{
    margin-top:20px;
    background:#16233b;
    padding:15px;
    border-radius:10px;
}

input{
    padding:10px;
    width:180px;
    border:none;
    border-radius:6px;
    font-size:16px;
}

button{
    padding:10px 15px;
    margin-left:5px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#00bfff;
    color:white;
    font-weight:bold;
}

button:hover{
    opacity:.85;
}


/* ==============================
   INFO
============================== */

.info{
    margin-top:15px;
}

.bar{
    height:20px;
    background:#333;
    border-radius:10px;
    overflow:hidden;
}

.fill{
    height:100%;
    background:#00ccff;
    width:0;
    transition:width .5s;
}


/* ==============================
   CHART
============================== */

.chart-box{
    margin-top:20px;
    background:#16233b;
    padding:15px;
    border-radius:10px;
}

.chart-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.chart-container{
    position:relative;
    height:420px;
    background:white;
    border-radius:8px;
    padding:5px;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:600px){

    .n{
        font-size:36px;
    }

    .chart-container{
        height:300px;
    }

}

</style>
</head>


<body>

<div class="c">

<h1>💰 MỤC TIÊU 1,000,000 USD</h1>


<!-- ==============================
     COUNTDOWN CHỈ NGÀY
============================== -->

<div class="cards">

    <div class="card">

        <div id="d" class="n">
            0
        </div>

        <div class="card-label">
            Ngày còn lại
        </div>

    </div>

</div>


<!-- ==============================
     INPUT
============================== -->

<div class="input-area">

    <strong>💵 Tài sản hiện tại:</strong>

    <input
        id="money"
        type="number"
        placeholder="Nhập USD"
        step="1"
    >

    <button id="btnSave">
        Cập nhật
    </button>

</div>


<!-- ==============================
     PROGRESS
============================== -->

<div class="info">

<h3>🎯 Mục tiêu 28/02/2027 : $1,000,000</h3>

<p>
Hoàn thành:
<strong id="pctYear">0%</strong>
</p>

<div class="bar">
<div id="barYear" class="fill"></div>
</div>

<br>

<h3>
📅 Mục tiêu tháng
<span id="monthName"></span>
:
$<span id="monthGoal"></span>
</h3>

<p>
Hoàn thành:
<strong id="pctMonth">0%</strong>
</p>

<div class="bar">
<div id="barMonth" class="fill"></div>
</div>

</div>
<!-- ==============================
     CHART
============================== -->

<div class="chart-box">

    <div class="chart-title">
        📊 Tài sản thực tế vs 🎯 Mục tiêu
    </div>

    <div class="chart-container">

        <canvas id="chart"></canvas>

    </div>

</div>

</div>


<script type="module">

/* =========================================================
   CẤU HÌNH
========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1TCytQaK8KiGfcGXwU_JvWPFYMMvfNqc",
  authDomain: "milliondollardashboard.firebaseapp.com",
  projectId: "milliondollardashboard",
  storageBucket: "milliondollardashboard.firebasestorage.app",
  messagingSenderId: "560429245546",
  appId: "1:560429245546:web:9a82b92c7b31c49702d613",
  measurementId: "G-1K1VE1JD4S"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const dashboardRef = doc(db, "dashboard", "main");
const GOAL = 1000000;


/*
    Countdown cuối cùng
*/

const END_DATE =
    new Date(
        2027,
        1,
        28,
        23,
        59,
        0
    );


/*
    MỤC TIÊU BẮT ĐẦU

    22/07/2026
    $1,300
*/

const TARGET_START =
    new Date(
        2026,
        6,
        22,
        0,
        0,
        0
    );


const TARGET_START_VALUE =
    1300;


/*
    MỤC TIÊU KẾT THÚC

    28/02/2027
    $917,566
*/

const TARGET_END =
    new Date(
        2027,
        1,
        28,
        23,
        59,
        0
    );


const TARGET_END_VALUE =
    917566;


/* =========================================================
   TÍNH TỶ LỆ LÃI KÉP
========================================================= */

const totalDays =
    (
        TARGET_END.getTime()
        -
        TARGET_START.getTime()
    )
    /
    86400000;


const DAILY_RATE =
    Math.pow(
        TARGET_END_VALUE /
        TARGET_START_VALUE,

        1 /
        totalDays
    )
    - 1;

/* =========================================================
   INPUT
========================================================= */

const moneyInput =
    document.getElementById("money");


/* =========================================================
   LỊCH SỬ TÀI SẢN
========================================================= */

let hist = [];


/* =========================================================
   THỰC TẾ BAN ĐẦU
========================================================= */


/*
    Bạn đã có:

    22/07/2026
    $1,300
*/

const fixedActualData = [

    {

        x:
            new Date(
                2026,
                6,
                22
            ).getTime(),

        y:
            1300

    }

];


/* =========================================================
   FORMAT USD
========================================================= */

function usd(value){

    return Number(
        value || 0
    ).toLocaleString(
        "en-US"
    );

}


/* =========================================================
   ĐỔI DD/MM/YYYY
========================================================= */

function dateFromString(str){

    const p =
        str.split("/");


    if(
        p.length !== 3
    ){

        return null;

    }


    return new Date(
        Number(p[2]),
        Number(p[1])-1,
        Number(p[0]),
        0,
        0,
        0
    );

}


/* =========================================================
   TARGET VALUE
========================================================= */


/*
    Tính theo lãi kép.

    Ví dụ:

    Ngày 1:
    $1,300

    Ngày 2:
    $1,300 × (1+r)

    Ngày 3:
    Ngày 2 × (1+r)

    ...
*/

function targetValue(date){

    if(
        date <
        TARGET_START
    ){

        return null;

    }


    if(
        date >=
        TARGET_END
    ){

        return TARGET_END_VALUE;

    }


    const elapsedDays =
        (
            date.getTime()
            -
            TARGET_START.getTime()
        )
        /
        86400000;


    return (
        TARGET_START_VALUE
        *
        Math.pow(
            1 + DAILY_RATE,
            elapsedDays
        )
    );

}


/* =========================================================
   NGÀY CUỐI BIỂU ĐỒ
========================================================= */

function getChartEndDate(){

    const now =
        new Date();


    /*
        Luôn lấy ngày cuối
        của tháng hiện tại.
    */

    let end =
        new Date(
            now.getFullYear(),
            now.getMonth()+1,
            0,
            23,
            59,
            59
        );


    /*
        Không cho vượt qua
        ngày kết thúc mục tiêu.
    */

    if(
        end >
        TARGET_END
    ){

        end =
            new Date(
                TARGET_END
            );

    }


    return end;

}


/* =========================================================
   DỮ LIỆU THỰC TẾ
========================================================= */

function actualData(){

    const result = [];


    /*
        Điểm thực tế ban đầu:

        22/07/2026
        $1,300
    */

    result.push(
        ...fixedActualData
    );


    /*
        Các dữ liệu thực tế
        được nhập hàng ngày.
    */

    hist.forEach(
        item => {

            const date =
                dateFromString(
                    item.d
                );


            if(!date)
                return;


            result.push({

                x:
                    date.getTime(),

                y:
                    Number(
                        item.v
                    ) || 0

            });

        }
    );


    /*
        Sắp xếp theo ngày
    */

    result.sort(
        (a,b) =>
            a.x-b.x
    );


    return result;

}


/* =========================================================
   DỮ LIỆU TARGET
========================================================= */

function targetData(){

    const chartEnd =
        getChartEndDate();


    return [

        {

            x:
                TARGET_START.getTime(),

            y:
                TARGET_START_VALUE

        },

        {

            x:
                chartEnd.getTime(),

            y:
                targetValue(
                    chartEnd
                )

        }

    ];

}


/* =========================================================
   CHART
========================================================= */

const ctx =
    document
        .getElementById(
            "chart"
        );


const chart =
    new Chart(
        ctx,
        {

            type:"line",

            data:{

                datasets:[

                    /* ==========================
                       THỰC TẾ
                    ========================== */

                    {

                        label:
                            "💰 Thực tế",

                        data:
                            actualData(),

                        borderColor:
                            "#0088ff",

                        backgroundColor:
                            "rgba(0,136,255,.10)",

                        borderWidth:3,

                        pointRadius:5,

                        pointHoverRadius:8,

                        tension:.25,

                        fill:false,

                        parsing:false

                    },


                    /* ==========================
                       MỤC TIÊU LÃI KÉP
                    ========================== */

                    {

                        label:
                            "🎯 Mục tiêu",

                        data:
                            targetData(),

                        borderColor:
                            "#FFD700",

                        backgroundColor:
                            "transparent",

                        borderWidth:3,

                        borderDash:[
                            8,
                            6
                        ],

                        pointRadius:6,

                        pointHoverRadius:9,

                        tension:.15,

                        fill:false,

                        parsing:false

                    }

                ]

            },


            options:{

                responsive:true,

                maintainAspectRatio:false,


                interaction:{

                    mode:"nearest",

                    intersect:false

                },


                plugins:{

                    legend:{

                        display:true,

                        position:"top"

                    },


                    tooltip:{

                        callbacks:{

                            title:function(items){

                                if(
                                    !items.length
                                ){

                                    return "";

                                }


                                return new Date(
                                    items[0]
                                        .parsed
                                        .x
                                ).toLocaleDateString(
                                    "vi-VN"
                                );

                            },


                            label:function(context){

                                return (
                                    context.dataset.label
                                    +
                                    ": $"
                                    +
                                    usd(
                                        context.parsed.y
                                    )
                                );

                            }

                        }

                    }

                },


                scales:{

                    x:{

                        type:"linear",


                        /*
                            Biểu đồ bắt đầu:

                            22/07/2026
                        */

                        min:
                            TARGET_START
                                .getTime(),


                        /*
                            Tự động đến
                            cuối tháng hiện tại
                        */

                        max:
                            getChartEndDate()
                                .getTime(),


                        title:{

                            display:true,

                            text:
                                "Thời gian"

                        },


                        ticks:{

                            maxTicksLimit:10,

                            callback:function(value){

                                const date =
                                    new Date(
                                        value
                                    );


                                return (
                                    String(
                                        date.getDate()
                                    ).padStart(
                                        2,
                                        "0"
                                    )
                                    +
                                    "/"
                                    +
                                    String(
                                        date.getMonth()+1
                                    ).padStart(
                                        2,
                                        "0"
                                    )
                                );

                            }

                        }

                    },


                    y:{

                        beginAtZero:true,

                        title:{

                            display:true,

                            text:
                                "USD"

                        },


                        ticks:{

                            callback:function(value){

                                return (
                                    "$"
                                    +
                                    Number(
                                        value
                                    ).toLocaleString(
                                        "en-US"
                                    )
                                );

                            }

                        }

                    }

                }

            }

        }

    );


/* =========================================================
   SAVE
========================================================= */

async function save(){

    const value = Number(moneyInput.value) || 0;

    const now = new Date();

    const dateString =
        String(now.getDate()).padStart(2,"0") + "/" +
        String(now.getMonth()+1).padStart(2,"0") + "/" +
        now.getFullYear();

    const snap = await getDoc(dashboardRef);

    let hist = [];

    if(snap.exists()){

        hist = snap.data().hist || [];

    }

    const index = hist.findIndex(x => x.d === dateString);

    if(index >= 0){

        hist[index].v = value;

    }else{

        hist.push({
            d: dateString,
            v: value
        });

    }

    await setDoc(
        dashboardRef,
        {
            money: value,
            hist: hist,
            updatedAt: serverTimestamp()
        },
        {
            merge:true
        }
    );

}

window.save = save;


document
    .getElementById("btnSave")
    .addEventListener("click", save);


onSnapshot(dashboardRef, async (docSnap)=>{

    if(!docSnap.exists()){

        await setDoc(dashboardRef,{
            money:1300,
            hist:[
                {
                    d:"22/07/2026",
                    v:1300
                }
            ],
            updatedAt:serverTimestamp()
        });

        return;

    }

    const data = docSnap.data();

    moneyInput.value = data.money || "";

    hist = data.hist || [];

    calc();

    updateChart();

});

/* =========================================================
   UPDATE CHART
========================================================= */

function updateChart(){

    /*
        Actual
    */

    chart.data.datasets[0].data =
        actualData();


    /*
        Target
    */

    chart.data.datasets[1].data =
        targetData();


    /*
        Tự động mở rộng
        đến cuối tháng hiện tại
    */

    chart.options.scales.x.min =
        TARGET_START.getTime();


    chart.options.scales.x.max =
        getChartEndDate()
            .getTime();


    chart.update();

}


/* =========================================================
   DASHBOARD
========================================================= */

function calc(){

    const value = Number(moneyInput.value)||0;

    //========================
    // Mục tiêu cuối
    //========================

    const yearPercent =
        Math.min(value/GOAL*100,100);

    pctYear.textContent =
        yearPercent.toFixed(2)+"%";

    barYear.style.width =
        yearPercent+"%";


    //========================
    // Mục tiêu tháng hiện tại
    //========================

    const endMonth =
        getChartEndDate();

    const monthTarget =
        targetValue(endMonth);

    monthGoal.textContent =
        usd(monthTarget.toFixed(0));

    monthName.textContent =
        (endMonth.getMonth()+1)
        +"/"+
        endMonth.getFullYear();

    const monthPercent =
        Math.min(
            value/monthTarget*100,
            100
        );

    pctMonth.textContent =
        monthPercent.toFixed(2)+"%";

    barMonth.style.width =
        monthPercent+"%";

}/* =========================================================
   COUNTDOWN CHỈ NGÀY
========================================================= */

function tick(){

    const diff =
        END_DATE -
        new Date();


    if(
        diff <= 0
    ){

        document.getElementById(
            "d"
        ).textContent =
            "0";

        return;

    }


    document.getElementById(
        "d"
    ).textContent =
        Math.floor(
            diff /
            86400000
        );

}


/* =========================================================
   TỰ ĐỘNG CHUYỂN THÁNG
========================================================= */

let lastMonth =
    new Date().getMonth();


let lastYear =
    new Date().getFullYear();


function checkMonth(){

    const now =
        new Date();


    const currentMonth =
        now.getMonth();


    const currentYear =
        now.getFullYear();


    if(
        currentMonth !==
        lastMonth
        ||
        currentYear !==
        lastYear
    ){

        lastMonth =
            currentMonth;


        lastYear =
            currentYear;


        updateChart();

    }

}


/* =========================================================
   START
========================================================= */

setInterval(
    tick,
    1000
);


setInterval(
    checkMonth,
    60000
);


tick();

calc();

updateChart();

</script>

</body>
</html>
